[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emergent-cells-meta-2026"
version = "0.1.0"
description = "Local cellular learning in resource-constrained worlds — Meta 2026 prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
emergent-cells = "emergent_cells.cli:main"

[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
emergent_cells = ["demo/*.html"]
