[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emergent-cells-meta-2026"
version = "0.2.0"
description = "Python-only reproducible research on cellular learning and memory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
studio = ["fastapi>=0.110,<1", "uvicorn>=0.30,<1"]

[project.scripts]
emergent-cells = "emergent_cells.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"emergent_cells.experiments" = ["studio.html"]
